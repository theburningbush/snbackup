[project]
name = "snbackup"
version = "2.3.0"
description = "CLI tool to backup Supernote files"
readme = "README.md"
authors = [
    { name = "devin", email = "devinwrx@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "rich>=14.3.1",
]

[project.scripts]
snbackup = "snbackup.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[project.urls]
Homepage = "https://github.com/theburningbush/snbackup"
Issues = "https://github.com/theburningbush/snbackup/issues"
